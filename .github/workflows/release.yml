name: Release

# Either push a tag such as v1.2.0, or run this workflow by hand on main (Actions → Release → Run workflow),
# which creates the tag v<versionName> itself. Either way the tag must match versionName in app/build.gradle.kts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # SHA-256 of the release signing certificate, as published in the README.
  CERT_SHA256: 577048407bb56cc11030f82661f9c036d366d64572fb8ccbdc527c8716ab2625
  # SHA-256 of the keystore file itself, so a wrong KEYSTORE_BASE64 is caught before the build.
  KEYSTORE_SHA256: 1cc2bee5381cbec96dc58a7d6ef09fd817f867181e5c796c4c977d6044c8f8fc

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Work out the release tag
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Run this workflow on main, not $GITHUB_REF_NAME"
              exit 1
            fi
            tag="v$version"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "::error::Tag $tag already exists; bump versionName first"
              exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
            if [ "v$version" != "$tag" ]; then
              echo "::error::Tag $tag does not match versionName $version"
              exit 1
            fi
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore and check signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Pasted secrets often pick up a trailing newline or spaces; strip them, then check each value on its own
          # so a failure names the secret that is wrong. Nothing secret is printed.
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//'; }
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set; refusing to publish a debug-signed release"
              exit 1
            fi
          done
          store_pw=$(trim "$KEYSTORE_PASSWORD")
          key_pw=$(trim "$KEY_PASSWORD")
          alias=$(trim "$KEY_ALIAS")
          echo "::add-mask::$store_pw"
          echo "::add-mask::$key_pw"
          [ "$store_pw" = "$KEYSTORE_PASSWORD" ] || echo "::warning::KEYSTORE_PASSWORD had surrounding whitespace; it was trimmed"
          [ "$key_pw" = "$KEY_PASSWORD" ] || echo "::warning::KEY_PASSWORD had surrounding whitespace; it was trimmed"

          dir="$RUNNER_TEMP/keystore"
          mkdir -p "$dir"
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 --decode > "$dir/release.jks" 2>/dev/null; then
            echo "::error::KEYSTORE_BASE64 is not valid base64"
            exit 1
          fi
          actual=$(sha256sum "$dir/release.jks" | cut -d' ' -f1)
          if [ "$actual" != "$KEYSTORE_SHA256" ]; then
            echo "::error::KEYSTORE_BASE64 does not decode to the release keystore (file SHA-256 $actual, expected $KEYSTORE_SHA256)"
            exit 1
          fi
          export STORE_PW="$store_pw"
          if ! keytool -list -keystore "$dir/release.jks" -storetype PKCS12 -storepass:env STORE_PW >/dev/null 2>&1; then
            echo "::error::KEYSTORE_PASSWORD does not open the keystore (it is ${#store_pw} characters after trimming; the right one is 32)"
            exit 1
          fi
          if ! keytool -list -keystore "$dir/release.jks" -storetype PKCS12 -storepass:env STORE_PW -alias "$alias" >/dev/null 2>&1; then
            echo "::error::KEY_ALIAS \"$alias\" is not in the keystore (expected phonemcp-release)"
            exit 1
          fi
          if [ "$key_pw" != "$store_pw" ]; then
            echo "::error::KEY_PASSWORD differs from KEYSTORE_PASSWORD; for this PKCS12 keystore they are the same value"
            exit 1
          fi
          {
            echo "PHONEMCP_STORE_FILE=$dir/release.jks"
            echo "PHONEMCP_STORE_PASSWORD=$store_pw"
            echo "PHONEMCP_KEY_ALIAS=$alias"
            echo "PHONEMCP_KEY_PASSWORD=$key_pw"
          } >> "$GITHUB_ENV"
          echo "Signing secrets OK"

      - name: Unit tests and release build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Verify signature
        run: |
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          apk=app/build/outputs/apk/release/app-release.apk
          "$apksigner" verify --print-certs "$apk" | tee signers.txt
          if ! grep -qi "certificate SHA-256 digest: $CERT_SHA256" signers.txt; then
            echo "::error::APK is not signed with the published release certificate"
            exit 1
          fi
          cp "$apk" "phone-mcp-$VERSION.apk"
          sha256sum "phone-mcp-$VERSION.apk" > "phone-mcp-$VERSION.apk.sha256"

      - name: Remove signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keystore"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk_sha=$(cut -d' ' -f1 "phone-mcp-$VERSION.apk.sha256")
          cat > notes.md <<NOTES
          ## Install
          Download \`phone-mcp-$VERSION.apk\` below. Needs Android 11+, arm64, and root or Shizuku.

          If you installed a build from before the public release, uninstall it first: it was signed with a different key.

          ## Verify
          - APK SHA-256: \`$apk_sha\`
          - Signing certificate SHA-256: \`$CERT_SHA256\`

          Check with \`apksigner verify --print-certs phone-mcp-$VERSION.apk\`.
          NOTES
          # On a manual run the tag does not exist yet: gh creates it on the commit that was built.
          gh release create "$TAG" "phone-mcp-$VERSION.apk" "phone-mcp-$VERSION.apk.sha256" \
            --target "$GITHUB_SHA" --title "Phone MCP $VERSION" --notes-file notes.md --generate-notes
